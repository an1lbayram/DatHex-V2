name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  server:
    name: Server (lint, unit, integration, security, audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Code quality (oxlint)
        working-directory: server
        run: npm run lint
      - name: Unit + integration + security tests
        working-directory: server
        run: npm run test:coverage
      - name: Dependency security audit (high+ severity)
        working-directory: server
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-coverage
          path: server/coverage
          retention-days: 14

  client-unit:
    name: Client (lint, component/unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Code quality (oxlint)
        working-directory: client
        run: npm run lint
      - name: Component + unit tests
        working-directory: client
        run: npm run test:coverage
      - name: Production build
        working-directory: client
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-coverage
          path: client/coverage
          retention-days: 14

  client-e2e:
    name: Client E2E (functional, a11y, SEO, responsive, cross-browser)
    runs-on: ubuntu-latest
    needs: client-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run Playwright test suite (all projects except visual regression)
        working-directory: client
        run: npx playwright test --project=chromium-desktop --project=firefox-desktop --project=webkit-desktop --project=mobile-chrome --project=tablet-safari
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
          retention-days: 14

  client-visual:
    name: Client visual regression
    runs-on: ubuntu-latest
    needs: client-unit
    # The committed baselines were captured on Windows (win32); Playwright
    # names snapshots per-OS, so this job's first run(s) on Linux will fail
    # with "no baseline" until the Linux-generated screenshots are reviewed
    # and committed (see client/e2e/visual.spec.js-snapshots/). Non-blocking
    # until then so it doesn't hold up the rest of CI.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps chromium
      - name: Run visual regression project
        working-directory: client
        run: npx playwright test --project=visual-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-visual-report
          path: client/playwright-report
          retention-days: 14

  lighthouse:
    name: Lighthouse CI (performance, SEO, best practices budgets)
    runs-on: ubuntu-latest
    needs: client-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build
      - name: Lighthouse CI
        working-directory: client
        run: npx lhci autorun
